name: Android APK (debug)
# 2026-11-08: re-register workflow on fork after enabling Actions.

# GitHub Actions 编译：解决 Muse VM 上 Gradle daemon 本地 TCP 被沙箱拦截的问题。
# 推送到 GitHub 后自动编，APK 不放 Actions Artifacts，改放到 GitHub Releases
#（用户 2026-11-03 明确要求：编译完成的 APK 放到 Releases）。
#
# 2026-11-03 18:42 失败修复：android-actions/setup-android@v3 在 runner 上
# 执行 sdkmanager tools 时报 Failed to find package 'tools'（tools 包已废弃，
# 被 cmdline-tools 取代），导致整个 run 在 Set up Android SDK 一步失败。
# 改为直接用 runner 自带的 Android SDK（/usr/local/lib/android/sdk），
# 不再用 setup-android 这个 action，只用其自带的 sdkmanager 装需要的包。
on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          build-root-directory: app-android
          arguments: :app:assembleDebug --stacktrace

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 小店AI助手 Debug build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app-android/app/build/outputs/apk/debug/app-debug.apk
